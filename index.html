<!doctype html><html lang="my"><head>

<style>
:root{--bg:#f6f7fb;--text:#181a26;--muted:#696c7a;--p:#9c5be2;--p2:#7d46be;--card:#fff;--line:#e2deee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:720px;margin:auto;padding:18px 16px 34px}.header,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 3px 14px #2314370f}
.header{display:flex;align-items:center;padding:14px 12px 14px 18px}.title{flex:1}.title h1{margin:0;font-size:27px}.title p{margin:4px 0 0;color:var(--muted);font-size:14px}
button{border:0;font:inherit;cursor:pointer}.icon{width:52px;height:52px;border-radius:16px;background:#f5f0fc;color:#704aa5;font-size:22px}
.label{margin:20px 2px 10px;font-size:13px;font-weight:800;color:#d23741}.card{padding:20px;margin-bottom:14px}.small{font-size:14px;color:var(--muted)}
.message{font-size:21px;font-weight:800;margin:12px 0 18px}.location{font-size:15px;color:#464b5a;margin-bottom:10px}.time{font-size:13px;color:#7d46be}
.status{padding:14px;text-align:center;border:1px solid #e1e3eb;border-radius:18px;background:#fff;color:var(--muted);font-size:13px}
.btn{width:100%;height:52px;border-radius:16px;margin-top:12px;background:var(--p);color:#fff;font-weight:700}.light{background:#e0c3fa;color:#2d1e3c!important}
.row{display:flex;gap:10px}.row .btn{flex:1}.section{font-size:20px;font-weight:800}.footer{text-align:center;color:#9b9eaa;font-size:12px;margin-top:24px}
.modal{position:fixed;inset:0;background:#0a080f73;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modal.open{display:flex}
.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}.sheet h2{margin:0 0 12px}
.input{width:100%;border:1px solid #d9d4e2;border-radius:14px;padding:13px;font:inherit;margin:6px 0 10px;background:#fff}textarea.input{min-height:110px;resize:vertical}
.msg{padding:14px;border:1px solid #e8eaf0;border-radius:16px;margin:9px 0}.meta{font-size:12px;color:var(--muted);margin-top:6px}.danger{background:#be4146!important}
.notice{background:#241b2d;color:#fff;border-radius:18px;padding:14px;margin-top:14px;font-size:13px}
</style></head><body><div class="app">
<div class="header"><div class="title"><h1>Aunglan 🚚</h1><p>Remainder</p></div><button class="icon" id="admin">⚙️</button></div>
<div class="label">● LATEST UPDATE</div><div class="card"><div class="small">အသိပေးချက်</div>
<div class="message" id="ann">အသိပေးချက် မရှိသေးပါ။</div><div class="location" id="loc">📌 Next — မသတ်မှတ်ရသေးပါ</div><div class="time" id="time">🕐 Update — Loading...</div></div>
<div class="status" id="status">🌐 Server မှ Update ကို စောင့်နေပါသည်...</div>
<button class="btn" id="reload">↻ Reload Update</button><div class="row"><button class="btn light" id="send">✉️ Send</button><button class="btn light" id="mine">📨 My Messages</button></div>
<button class="btn" id="notify">🔔 Enable iPhone Notifications</button>
<div class="card" style="margin-top:20px"><div class="section">💳 Quick Pay</div><div class="small">တန်ဆာခပေးရန်</div><p>👤 <b>Tin Win Ko</b><br>📱 09952599995</p><div class="row"><button class="btn light" onclick="alert('KPay: 09952599995')">💳 KPay</button><button class="btn light" id="copy">📋 Copy No</button></div></div>
<div class="row"><button class="btn light" onclick="location.href='tel:09952599995'">📞 U9</button><button class="btn light" onclick="location.href='tel:09444551119'">📞 MPT</button><button class="btn light" onclick="location.href='viber://chat/?number=%2B959952599995'">Viber</button></div>
<div class="footer">Tin Win Ko • Information Service</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
const API="https://aunglan.alwaysdata.net/",PIN="2580",KEY="aunglan_web_device_id";
const FB={apiKey:"AIzaSyDhUAq9hqVtz3hKl-xmbWR3DZITGAtZgME",authDomain:"aunglan-2fae0.firebaseapp.com",projectId:"aunglan-2fae0",storageBucket:"aunglan-2fae0.firebasestorage.app",messagingSenderId:"1013010215516",appId:"1:1013010215516:web:ccf9df38eee7319ca1ac99",measurementId:"G-7WYBDSSVDD"};
const VAPID="BCJLiy9nLGCfVYNHNa6oYWg96GYj8HwIcrEU5EHQ2d5n6dVzFTLZ4bR6BqhwJftI3zW-Y6NixJ5DRRG3pYatlX0";
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function did(){let x=localStorage.getItem(KEY);if(!x){x=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();localStorage.setItem(KEY,x)}return x}
function modal(h){$("sheet").innerHTML=h;$("modal").classList.add("open")}function close(){ $("modal").classList.remove("open")}
$("modal").onclick=e=>{if(e.target.id==="modal")close()};
async function update(){ $("status").textContent="🔄 Loading...";try{let r=await fetch(API+"get_update.php?t="+Date.now(),{cache:"no-store"}),j=await r.json();if(!j.success)throw Error(j.message);let d=j.data||{};$("ann").textContent=d.announcement||"အသိပေးချက် မရှိသေးပါ။";$("loc").textContent=d.location?"📌 Next — "+d.location:"📍 လက်ရှိနေရာ — မသတ်မှတ်ရသေးပါ";$("time").textContent=d.updated_at?"🕐 Update — "+d.updated_at+" MMT":"🕐 Update — အချိန်မရရှိသေးပါ";$("status").textContent="✅ Server Updated"}catch(e){$("status").textContent="⚠️ Can't connect to Server"}}
async function allMsgs(){let r=await fetch(API+"get_messages.php?t="+Date.now(),{cache:"no-store"}),j=await r.json();return j.data||[]}
function card(m,a){return `<div class="msg"><b>👤 ${esc(m.sender_name||"Unknown")}</b>${a&&m.sender_phone?`<div class="meta">📱 ${esc(m.sender_phone)}</div>`:""}<div style="margin-top:8px">📨 ${esc(m.message||"")}</div><div class="meta">🕐 ${esc(m.created_at||"")}</div>${a?`<div class="meta">${m.read_at?"✅ Read":"🔵 Unread"}</div>${!m.read_at?`<button class="btn" onclick="readMsg(${+m.id},this)">✓ Mark as Read</button>`:""}<button class="btn danger" onclick="delMsg(${+m.id},this)">🗑 Delete</button>`:""}</div>`}
async function readMsg(id,b){let r=await fetch(API+"mark_message_read.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"id="+id}),j=await r.json();if(!j.success)alert(j.message);else{b.textContent="✓ Read";b.disabled=true}}
async function delMsg(id,b){if(!confirm("ဒီ Message ကို အပြီးဖျက်မလား?"))return;let r=await fetch(API+"delete_message.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"id="+id}),j=await r.json();if(j.success)b.closest(".msg").remove();else alert(j.message)}
$("send").onclick=()=>modal(`<h2>✉️ Send Message</h2><input class="input" id="n" placeholder="Company Name" value="${esc(localStorage.getItem("sender_name")||"")}"><input class="input" id="p" placeholder="Phone Number" value="${esc(localStorage.getItem("sender_phone")||"")}"><textarea class="input" id="m" placeholder="Write your message..."></textarea><button class="btn" onclick="sendMsg()">Send</button><button class="btn light" onclick="close()">Cancel</button>`);
async function sendMsg(){let n=$("n").value.trim(),p=$("p").value.trim(),m=$("m").value.trim();if(!n||!p||!m)return alert("Name, Phone Number နဲ့ Message အားလုံးထည့်ပါ");localStorage.setItem("sender_name",n);localStorage.setItem("sender_phone",p);let r=await fetch(API+"send_message.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({device_id:did(),sender_name:n,sender_phone:p,message:m})}),j=await r.json();if(j.success){close();alert("✅ Message ပို့ပြီးပါပြီ")}else alert(j.message)}
$("mine").onclick=async()=>{modal("<h2>📨 My Messages</h2><div id='list'>Loading...</div>");let a=await allMsgs(),m=a.filter(x=>x.device_id===did());$("list").innerHTML=m.length?m.map(x=>card(x,false)).join(""):"စာပို့ထားတာ မရှိသေးပါ။"};
$("admin").onclick=()=>modal(`<h2>🔐 Locked Mode</h2><input class="input" id="pin" type="password" inputmode="numeric" placeholder="Admin PIN"><button class="btn" onclick="login()">Login</button><button class="btn light" onclick="close()">Cancel</button>`);
function login(){if($("pin").value.trim()!==PIN)return alert("PIN မမှန်ပါ");modal(`<h2>⚙️ Aunglan Admin</h2><input class="input" id="next" placeholder="📌 Next"><textarea class="input" id="a" placeholder="📢 Announcement"></textarea><button class="btn" onclick="adminUpdate()">UPDATE</button><button class="btn light" onclick="adminMsgs()">📨 Messages</button><button class="btn light" onclick="close()">Close</button>`)}
async function adminUpdate(){let l=$("next").value.trim(),a=$("a").value.trim();if(!l||!a)return alert("Next နဲ့ Announcement နှစ်ခုလုံးထည့်ပါ");let t=new Date().toLocaleString("sv-SE",{timeZone:"Asia/Yangon",hour12:false}).replace("T"," "),r=await fetch(API+"update.php",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({location:l,announcement:a,updated_at:t})}),j=await r.json();if(j.success){close();update();alert("✅ Update ပြီးပါပြီ")}else alert(j.message)}
async function adminMsgs(){modal("<h2>📨 Messages</h2><div id='list'>Loading...</div>");let a=await allMsgs();$("list").innerHTML=a.length?a.map(x=>card(x,true)).join(""):"Message မရှိသေးပါ။"}
async function notify(){if(!("Notification"in window)||!("serviceWorker"in navigator))return alert("ဒီ iPhone/browser မှာ notification မရပါ");if(location.protocol!=="https:")return alert("HTTPS လိုအပ်ပါတယ်");if(Object.values(FB).some(x=>x.startsWith("REPLACE_"))||VAPID.startsWith("REPLACE_"))return alert("Firebase Web App config နဲ့ VAPID public key ကိုထည့်ပြီးမှ Notifications ဖွင့်နိုင်ပါမယ်");try{let p=await Notification.requestPermission();if(p!=="granted")return alert("Notification permission မပေးထားပါ");if(!firebase.apps.length)firebase.initializeApp(FB);let reg=await navigator.serviceWorker.register("./firebase-messaging-sw.js"),token=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});await fetch(API+"register_web_token.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,device_id:did()})});$("notify").textContent="✅ iPhone Notifications Enabled";alert("✅ Notifications ဖွင့်ပြီးပါပြီ")}catch(e){alert("Notification setup error: "+e.message)}}
$("notify").onclick=notify;$("reload").onclick=update;$("copy").onclick=async()=>{await navigator.clipboard.writeText("09952599995");alert("Copied")};update();
</script></body></html>
